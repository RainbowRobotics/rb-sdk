name: copy-apt-gpg-secret-to-muscat

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository that will receive the APT signing secrets
        required: true
        default: RainbowRobotics/Muscat

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy APT signing secrets
        env:
          GH_TOKEN: ${{ secrets.MUSCAT_SECRETS_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          RB_SDK_APT_GPG_PRIVATE_KEY: ${{ secrets.RB_SDK_APT_GPG_PRIVATE_KEY }}
          RB_SDK_APT_GPG_PASSPHRASE: ${{ secrets.RB_SDK_APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          [ -n "${GH_TOKEN:-}" ] || { echo "MUSCAT_SECRETS_TOKEN is not set"; exit 1; }
          [ -n "${RB_SDK_APT_GPG_PRIVATE_KEY:-}" ] || { echo "RB_SDK_APT_GPG_PRIVATE_KEY is not set"; exit 1; }

          printf '%s' "$RB_SDK_APT_GPG_PRIVATE_KEY" \
            | gh secret set RB_SDK_APT_GPG_PRIVATE_KEY -R "$TARGET_REPOSITORY"

          if [ -n "${RB_SDK_APT_GPG_PASSPHRASE:-}" ]; then
            printf '%s' "$RB_SDK_APT_GPG_PASSPHRASE" \
              | gh secret set RB_SDK_APT_GPG_PASSPHRASE -R "$TARGET_REPOSITORY"
          else
            echo "RB_SDK_APT_GPG_PASSPHRASE is not set; skipped."
          fi

          gh secret list -R "$TARGET_REPOSITORY" \
            | awk '{ print $1 }' \
            | grep -E '^(RB_SDK_APT_GPG_PRIVATE_KEY|RB_SDK_APT_GPG_PASSPHRASE)$' \
            || true
